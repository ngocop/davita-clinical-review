name: Keep Supabase & Streamlit Alive

on:
  schedule:
    # Runs every Monday and Thursday at 08:00 MYT (00:00 UTC)
    - cron: '0 0 * * 1,4'
  workflow_dispatch: # Allows manual testing from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: curl -s -o /dev/null -w "Streamlit HTTP %{http_code}\n" "${{ secrets.STREAMLIT_APP_URL }}"

      - name: Ping Supabase REST Health Endpoint
        run: |
          curl -s -o /dev/null -w "Supabase HTTP %{http_code}\n" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_PROJECT_URL }}/rest/v1/"
